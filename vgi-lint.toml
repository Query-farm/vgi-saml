# vgi-lint-check configuration for the vgi-saml worker.
#
# Execution is ENABLED: the worker is pure local compute (no network, no key
# store, no credentials), and every shipped example / agent test task uses a
# literal SAML message, so the VGI9xx execution rules run the examples against a
# live worker with no external dependency. The repo's haybarn SQLLogic E2E
# (`./run_tests.sh`) additionally exercises the natural LATERAL-over-a-column
# shape against committed signed fixtures.
#
# No rule is suppressed (`ignore = []`); all metadata and execution rules gate at
# `info`.
[tool.vgi-lint-check]
select = ["ALL"]
ignore = []
fail_on = "info"

[tool.vgi-lint-check.options]
column_comment_min_ratio = 0.8
