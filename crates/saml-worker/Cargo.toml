[package]
name = "saml-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VGI worker bringing SAML 2.0 decode + XML-DSig / exclusive-C14N verification + XSW / Golden-SAML detection to DuckDB over Apache Arrow"

[lib]
name = "saml_worker"
path = "src/lib.rs"

[[bin]]
name = "saml-worker"
path = "src/main.rs"

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
saml-core.workspace = true
log = "0.4"

# --- Native ---------------------------------------------------------------
# The SDK's real default features (sqlite + HTTP transport) — unchanged from
# before the wasm split. env_logger drives the native binary's stderr logging.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vgi = { workspace = true, features = ["sqlite", "transport-http"] }
vgi-rpc = { workspace = true, features = ["http"] }
env_logger = "0.11"

# --- wasm32 ---------------------------------------------------------------
# No sqlite (C) and no HTTP transport (tokio/mio/axum); the bincode stream codec
# is what the SAB byte-channel transport needs. No env_logger.
[target.'cfg(target_arch = "wasm32")'.dependencies]
vgi = { workspace = true }
vgi-rpc = { workspace = true, features = ["stream-codec"] }
